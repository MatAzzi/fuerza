<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fuerza · Registro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><h1 id="title">Inicio</h1></header>

  <main id="main"></main>

  <div id="timer" class="timer hidden" role="timer" aria-live="off">
    <div class="t-fill" id="tFill"></div>
    <div class="t-info"><span id="tLabel">Descanso</span><b id="tTime">2:00</b></div>
    <button data-a="timerMinus" aria-label="Restar 15 segundos">−15</button>
    <button data-a="timerPlus" aria-label="Sumar 15 segundos">+15</button>
    <button data-a="timerSkip" aria-label="Saltar descanso">✕</button>
  </div>

  <nav id="nav">
    <a href="#/home" data-r="home"><span>⌂</span>Inicio</a>
    <a href="#/session" data-r="session"><span>●</span>Sesión</a>
    <a href="#/history" data-r="history"><span>☰</span>Historial</a>
    <a href="#/progress" data-r="progress"><span>↗</span>Progreso</a>
    <a href="#/week" data-r="week"><span>▦</span>Semana</a>
    <a href="#/settings" data-r="settings"><span>⚙</span>Ajustes</a>
  </nav>

  <div id="sheet" class="sheet hidden"><div class="sheet-card"></div></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
